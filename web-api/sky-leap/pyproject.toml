[project]
name = "sky-leap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arun Kumar", email = "khanaru308@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.126",
    "botocore[crt]>=1.43.126",
    "fastapi>=0.162.2",
    "libmagic>=1.0",
    "pinecone>=10.3.0",
    "unstructured[all-docs]>=0.27.37",
]

[project.scripts]
sky-leap = "sky_leap:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
